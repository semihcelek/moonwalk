name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # MoonWalk is developed and tested on Windows (job objects, PATHEXT).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/MoonWalk -c Release -nologo
