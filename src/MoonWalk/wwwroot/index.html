<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonWalk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238ab4ff' d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <span>MoonWalk</span>
    </a>
    <nav class="nav">
      <a href="#/" class="nav-link" id="navRuns">Runs</a>
      <a href="#/settings" class="nav-link" id="navSettings">Settings</a>
    </nav>
    <div class="spacer"></div>
    <button class="bell" id="bell" type="button" aria-label="Notifications" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>
    </button>
    <div class="conn" id="conn" title="Live connection to the MoonWalk service"><span class="dot"></span><span id="connText">connecting</span></div>
    <button class="btn primary" id="newRunBtn" type="button">New run</button>
  </header>

  <main id="view"></main>

  <dialog id="newRun">
    <form method="dialog" id="newRunForm" class="modal">
      <h2>New run</h2>
      <label class="field">
        <span>Brief</span>
        <textarea id="brief" rows="6" placeholder="Describe the feature or fix. The spec stage turns this into acceptance criteria." required></textarea>
      </label>
      <label class="field">
        <span>Project</span>
        <select id="project"><option value="demo">demo</option></select>
        <small id="projectNote" class="hint"></small>
      </label>
      <fieldset class="field stage-agents" id="stageAgents" hidden>
        <legend>Agent per stage</legend>
        <div class="preset-row">
          <select id="presetSelect" aria-label="Preset"></select>
          <button class="btn small" type="button" id="presetSave" title="Save the current choices as a preset">Save as preset</button>
          <button class="btn small danger" type="button" id="presetDelete" title="Delete the selected saved preset" hidden>Delete</button>
        </div>
        <div id="stageAgentRows"></div>
        <small class="hint">Blank means the project's default. Plan with a strong model, implement with a cheaper one.</small>
      </fieldset>
      <div class="modal-actions">
        <button class="btn" value="cancel" type="button" id="newRunCancel">Cancel</button>
        <button class="btn primary" type="submit" id="newRunSubmit">Start run</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
